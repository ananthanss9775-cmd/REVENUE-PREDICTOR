
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Enterprise Revenue Predictor{% endblock %}</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block extra_css %}{% endblock %}
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark main-navbar">
        <div class="container">

            <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
                <i class="bi bi-graph-up-arrow"></i>
                RevenuePredict
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('home') }}">
                            <i class="bi bi-house"></i> Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('predict') }}">
                            <i class="bi bi-calculator"></i> Prediction
                        </a>
                    </li>

                    <li class="nav-item ms-lg-3">
                        <a href="{{ url_for('predict') }}" class="btn btn-nav">
                            Get Started <i class="bi bi-arrow-right"></i>
                        </a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>


    <!-- Main Page Content -->
    <main>
        {% block content %}

        {% endblock %}
    </main>


    <!-- Footer -->
    <footer class="main-footer">
        <div class="container text-center">

            <h5>
                <i class="bi bi-graph-up-arrow"></i>
                RevenuePredict
            </h5>

            <p>
                Enterprise Revenue Prediction Using Machine Learning
            </p>

            <p class="copyright">
                © 2026 Enterprise Revenue Prediction System.
                All Rights Reserved.
            </p>

        </div>
    </footer>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}{% endblock %}

</body>
</html>
